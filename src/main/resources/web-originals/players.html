<style>
.grid-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
}
.card {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1rem;
    background-color: var(--light-color);
}
input[type="search"] {
    padding: 0.5rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 1rem;
}
</style>
<script>
function filterPlayers() {
    const searchInput = document.getElementById('player-search');
    const filter = searchInput.value.toLowerCase();
    const playerCards = document.querySelectorAll('.card');

    playerCards.forEach(card => {
        const playerName = card.querySelector('h3').textContent.toLowerCase();
        if (playerName.includes(filter)) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
}
</script>
<h2>Manage Players</h2>
<input type="search" name="player-search" id="player-search" placeholder="Search players..." oninput="filterPlayers()">
<div class="grid-list">
    <!players>
</div>
