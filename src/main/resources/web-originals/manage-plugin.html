<style>
    .options {
        border: 1px solid #ccc;
        padding: 20px;
        margin: 20px 0;
        border-radius: 5px;
        background-color: var(--very-light-color);

    }
    .options h2 {
        margin-top: 0;
    }
    .form-group {
        display: block;
        margin-bottom: 15px;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    input[type="checkbox"] {
        width: 20px;
        height: 20px;
    }
    button {
        background-color: var(--success-color);
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }
    button:hover {
        background-color: var(--success-color-dark);
    }
    form {
        margin-bottom: 10px;
    }
</style>
<div class="options">
    <h2>Settings:</h2>
    <form action="/settings" method="POST">
        <div class="form-group">
            <label for="prefix-space">Prefix Space: </label>
            <input type="checkbox" id="prefix-space" name="prefix-space" <!prefix-space>>
        </div>
        <div class="form-group">
            <label for="suffix-space">Suffix Space: </label>
            <input type="checkbox" id="suffix-space" name="suffix-space" <!suffix-space>>
        </div>
        <button type="submit">Save Changes</button>
    </form>
    <form action="/settings/reload" method="POST">
        <button type="submit">Reload Plugin</button>
    </form>
</div>
